[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas_lms_python_client"
version = "1.0.0"
description = "Async Python client for Canvas LMS API with Link header pagination support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Ivonne Roberts"}
]
keywords = ["canvas", "lms", "api", "client", "async", "pagination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
]

dependencies = [
    "aiohttp>=3.8.4",
    "aiohttp-retry>=2.8.3",
    "pydantic>=2.11",
    "python-dateutil>=2.8.2",
    "typing-extensions >= 4.7.1",
    "urllib3>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["canvas_python_client*"]
exclude = [
    "canvas_python_client.test*",
    "canvas_python_client.docs*",
    "canvas_python_client.*",
    "canvas_python_client.*.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/canvas_lms_python_client/test/custom", "src/canvas_lms_python_client/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
